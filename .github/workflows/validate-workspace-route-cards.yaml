name: validate-workspace-route-cards

on:
  push:
    branches:
      - fix/route-card-workspace-nav

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format lib/common/navigator.dart lib/views/control/tiles.dart test/views/control_center_test.dart
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- lib/common/navigator.dart lib/views/control/tiles.dart test/views/control_center_test.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/common/navigator.dart lib/views/control/tiles.dart test/views/control_center_test.dart
          git commit -m "style: format workspace navigation fix"
          git push
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip native hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
      - name: Control center tests
        run: flutter test test/views/control_center_test.dart --reporter expanded
      - name: Navigator tests
        run: flutter test test/common/navigator_test.dart --reporter expanded
      - name: Home tests
        run: flutter test test/pages/home_test.dart --reporter expanded
