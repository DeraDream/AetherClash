name: validate-editor-schema

on:
  push:
    branches:
      - feat/mihomo-editor-schema

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Editor schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed editor files
        run: |
          dart format \
            lib/features/editor \
            lib/pages/editor.dart \
            lib/views/config/network.dart \
            test/features/editor_schema_test.dart
          git diff -- \
            lib/features/editor \
            lib/pages/editor.dart \
            lib/views/config/network.dart \
            test/features/editor_schema_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run schema tests
        run: flutter test test/features/editor_schema_test.dart --reporter expanded

      - name: Run full tests
        run: flutter test --reporter compact
