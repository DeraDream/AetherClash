name: validate-editor-schema

on:
  push:
    branches:
      - feat/editor-schema-v1.19.32

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Editor schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed editor files
        run: |
          dart format             lib/features/editor             lib/pages/editor.dart             lib/views/profiles/edit.dart             lib/views/config/network.dart             test/features/editor_completion_engine_test.dart

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet --             lib/features/editor             lib/pages/editor.dart             lib/views/profiles/edit.dart             lib/views/config/network.dart             test/features/editor_completion_engine_test.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/editor             lib/pages/editor.dart             lib/views/profiles/edit.dart             lib/views/config/network.dart             test/features/editor_completion_engine_test.dart
          git commit -m "style: format editor schema changes"
          git push

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run editor schema tests
        run: flutter test test/features/editor_completion_engine_test.dart --reporter expanded

      - name: Run all Flutter tests
        run: flutter test --reporter compact
