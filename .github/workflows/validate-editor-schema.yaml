name: validate-editor-schema

on:
  push:
    branches:
      - feat/editor-schema-v1.19.32

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Editor schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run editor schema tests
        run: flutter test test/features/editor_completion_engine_test.dart --reporter expanded

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run all Flutter tests
        run: flutter test --reporter compact
