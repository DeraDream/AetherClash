name: desktop-ui-review

on:
  push:
    branches:
      - review/desktop-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-review-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'

jobs:
  verify:
    name: Verify Flutter UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        shell: bash
        run: |
          dart format lib test tool plugins setup.dart
          git diff --check
          git diff --exit-code

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks for tests
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run tests
        run: flutter test --reporter expanded

  windows:
    name: Windows amd64 review build
    runs-on: windows-2022
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Package Windows
        run: dart setup.dart windows --env stable -v

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: po0-clash-desktop-ui-review-windows-amd64
          path: ./dist
          overwrite: true
