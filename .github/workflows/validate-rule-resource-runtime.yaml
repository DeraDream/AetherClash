name: validate-rule-resource-runtime

on:
  push:
    branches:
      - main

concurrency:
  group: validate-rule-resource-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Rule and resource Dart tests
        run: |
          flutter test --reporter expanded test/providers/setup_action_test.dart
          flutter test --reporter expanded test/providers/action_test.dart
          flutter test --reporter expanded test/views/resources_view_test.dart

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Go format
        run: |
          files="$(gofmt -l core/*.go)"
          test -z "$files" || {
            echo "$files"
            exit 1
          }

      - name: Rule and resource Core tests
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 -run 'TestRuntimeRulesExposeMihomoWrapperStatsAndToggle|TestUpdateExternalRuleProviderActuallyRunsUpdate|TestUpdateGeoDataActuallyRunsSelectedUpdater' .
          go test -count=1 .
          go vet .
