name: validate-rules-resources

on:
  push:
    branches:
      - fix/route-card-workspace-nav

concurrency:
  group: validate-rules-resources-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format             lib/enum/enum.dart             lib/common/l10n_labels.dart             lib/models/clash_config.dart             lib/providers/database.dart             lib/providers/actions/setup.dart             lib/common/preferences.dart             lib/views/routing_rules.dart             lib/views/navigation.dart             lib/views/views.dart             lib/views/tools.dart             lib/views/resources.dart
      - name: Show formatter diff
        run: git diff -- lib test tool plugins setup.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
      - name: Focused tests
        run: |
          flutter test --reporter expanded             test/models/rule_test.dart             test/providers/setup_action_test.dart             test/views/resources_view_test.dart             test/providers/database_test.dart
